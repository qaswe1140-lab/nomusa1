<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 노무사 조문집</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0F0F10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="조문집">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0F0F10;
    --surface:#17181A;
    --surface-2:#1D1E21;
    --text:#E7E5E1;
    --text-soft:#87857F;
    --line:#232427;
    --accent:#A68A5B;
    --accent-soft:rgba(166,138,91,0.14);
    --danger:#C4685A;
    --success:#6FA97C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    letter-spacing:-0.005em;
    display:flex;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-soft); color:var(--text); }

  /* ===== Sidebar ===== */
  .spine{
    width:216px;
    flex-shrink:0;
    background:var(--bg);
    color:var(--text);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  .spine-title{
    font-weight:700;
    font-size:15px;
    padding:0 20px 20px;
    line-height:1.4;
    letter-spacing:-0.01em;
  }
  .spine-title small{
    display:block;
    font-weight:400;
    font-size:11px;
    color:var(--text-soft);
    margin-top:4px;
    letter-spacing:0;
  }
  .volumes{ margin-top:4px; }
  .volume{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 20px;
    cursor:pointer;
    font-weight:500;
    font-size:13.5px;
    color:var(--text-soft);
    border-radius:0;
    transition:all .12s ease;
  }
  .volume .num{
    display:none;
  }
  .volume:hover{ background:var(--surface); color:var(--text); }
  .volume.active{
    background:var(--surface);
    color:var(--text);
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .volume .cnt{
    margin-left:auto;
    font-size:11px;
    color:var(--text-soft);
  }
  .volume-edit{
    font-size:11px;
    opacity:0.45;
    cursor:pointer;
    flex-shrink:0;
  }
  .volume-edit:hover{ opacity:1; }
  .volume-editing{ cursor:default; }
  .volume-input{
    flex:1;
    min-width:0;
    font-family:'Pretendard',sans-serif;
    font-size:13px;
    padding:5px 8px;
    border:1px solid var(--accent);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
  }
  .spine-foot{
    margin-top:auto;
    padding:16px 20px 0;
    font-size:11px;
    color:var(--text-soft);
    line-height:1.6;
  }
  .spine-section{
    padding:14px 20px 2px;
    margin-top:4px;
  }
  .spine-section-label{
    font-size:10.5px;
    letter-spacing:0.04em;
    color:var(--text-soft);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .ext-link{
    display:flex; align-items:center; gap:8px;
    padding:6px 0;
    font-size:12.5px;
    color:var(--text-soft);
    text-decoration:none;
  }
  .ext-link:hover{ color:var(--text); }
  .ext-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .upload-entry{
    display:flex; align-items:center; gap:8px;
    width:100%;
    padding:7px 0;
    background:none; border:none;
    font-size:12.5px;
    color:var(--text-soft);
    cursor:pointer;
    text-align:left;
  }
  .upload-entry:hover{ color:var(--text); }
  .ext-link-row{ display:flex; align-items:center; gap:6px; }
  .ext-link-row .ext-link{ flex:1; }
  .ext-remove{
    font-size:11px; color:var(--text-soft); opacity:0.4; cursor:pointer; padding:2px 4px; flex-shrink:0;
  }
  .ext-remove:hover{ color:var(--danger); opacity:1; }
  .shortcut-input{
    width:100%;
    font-size:12.5px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
  }

  /* ===== 중요도 등급(A~D) 스크롤 피커 ===== */
  .grade-picker{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:2px 2px 6px;
    -webkit-overflow-scrolling:touch;
  }
  .grade-picker::-webkit-scrollbar{ height:4px; }
  .grade-picker::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .grade-pill{
    scroll-snap-align:center;
    flex:0 0 auto;
    width:52px;
    height:40px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface-2);
    color:var(--text-soft);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .grade-pill:hover{ border-color:var(--text-soft); }
  .grade-pill.active[data-grade="A"]{ background:rgba(196,104,90,0.18); border-color:var(--danger); color:var(--danger); }
  .grade-pill.active[data-grade="B"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .grade-pill.active[data-grade="C"]{ background:rgba(111,169,124,0.16); border-color:var(--success); color:var(--success); }
  .grade-pill.active[data-grade="D"]{ background:rgba(135,133,127,0.18); border-color:var(--text-soft); color:var(--text); }
  .grade-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px;
    border-radius:6px;
    font-size:11px; font-weight:700;
    flex-shrink:0;
  }
  .grade-badge[data-grade="A"]{ background:rgba(196,104,90,0.18); color:var(--danger); }
  .grade-badge[data-grade="B"]{ background:var(--accent-soft); color:var(--accent); }
  .grade-badge[data-grade="C"]{ background:rgba(111,169,124,0.16); color:var(--success); }
  .grade-badge[data-grade="D"]{ background:rgba(135,133,127,0.18); color:var(--text); }

  .setup-error-banner{
    position:fixed; top:0; left:0; right:0; z-index:200;
    background:var(--danger); color:#1A0E0C;
    font-size:13px; font-weight:600;
    padding:10px 20px;
    text-align:center;
    line-height:1.5;
  }

  /* ===== Main ===== */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex;
    align-items:center;
    gap:22px;
    padding:22px 32px 0;
    border-bottom:1px solid var(--line);
  }
  .tab{
    font-weight:500;
    font-size:13.5px;
    padding:0 0 14px;
    color:var(--text-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }
  .content{ flex:1; padding:28px 32px 40px; overflow-y:auto; }

  .subject-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:20px;
  }
  .subject-head h1{
    font-weight:700;
    font-size:20px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .subject-head .sub{
    font-size:12px;
    color:var(--text-soft);
  }

  /* ===== add note form ===== */
  .add-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  .add-card h3{
    margin:0 0 14px;
    font-weight:600;
    font-size:13.5px;
    color:var(--text);
  }
  .field-row{ display:flex; gap:10px; margin-bottom:10px; }
  input[type=text], textarea{
    width:100%;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    font-size:13.5px;
    line-height:1.6;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    color:var(--text);
    resize:vertical;
  }
  textarea{ min-height:68px; }
  input::placeholder, textarea::placeholder{ color:var(--text-soft); opacity:0.6; }
  input:focus, textarea:focus, button:focus, .volume:focus, .tab:focus{
    outline:none; border-color:var(--accent);
  }
  label{ font-size:11px; color:var(--text-soft); display:block; margin-bottom:5px; }
  .btn{
    font-weight:600;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#1A1305;
    cursor:pointer;
    transition:opacity .15s;
  }
  .btn:hover{ opacity:0.85; }
  .btn.ghost{ background:transparent; color:var(--text-soft); border-color:var(--line); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--text-soft); }
  .btn.small{ padding:6px 11px; font-size:11.5px; }
  .btn.danger{ border-color:var(--danger); color:var(--danger); background:transparent; }

  /* ===== note cards ===== */
  .note-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:10px;
  }
  .note-top{ display:flex; justify-content:space-between; gap:10px; }
  .note-title{ font-size:14.5px; font-weight:600; letter-spacing:-0.005em; }
  .note-date{ font-size:10.5px; color:var(--text-soft); white-space:nowrap; }
  .note-keywords{ margin:8px 0 10px; display:flex; flex-wrap:wrap; gap:6px; }
  .kw{
    font-size:11px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:3px 9px;
    border-radius:6px;
  }
  .note-body{ font-size:13px; line-height:1.75; white-space:pre-wrap; color:var(--text-soft); }
  .note-actions{ margin-top:12px; display:flex; gap:8px; }
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--text-soft);
    font-size:13.5px;
    line-height:1.7;
  }

  /* ===== flashcard mode ===== */
  .fc-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:16px; }
  .fc-progress{ font-size:12px; color:var(--text-soft); margin-bottom:14px; }
  .flashcard{
    width:100%; max-width:500px; min-height:250px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
  }
  .flashcard .face-label{
    position:absolute; top:16px; left:18px;
    font-size:10px; color:var(--accent); letter-spacing:0.06em; text-transform:uppercase;
  }
  .flashcard .fc-title{ font-weight:700; font-size:18px; margin-bottom:10px; letter-spacing:-0.01em; }
  .flashcard .fc-body{ font-size:13.5px; line-height:1.8; color:var(--text-soft); white-space:pre-wrap; }
  .fc-controls{ display:flex; gap:8px; margin-top:18px; }

  /* ===== quiz mode ===== */
  .quiz-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:16px; }
  .quiz-card{
    width:100%; max-width:500px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 26px;
  }
  .quiz-q{ font-weight:700; font-size:16px; margin-bottom:10px; letter-spacing:-0.01em; }
  .quiz-kw{ margin-bottom:14px; }
  .quiz-answer{
    margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
    font-size:13.5px; line-height:1.8; color:var(--text-soft); white-space:pre-wrap;
  }
  .quiz-score{ font-size:12px; color:var(--text-soft); margin-bottom:12px; }

  /* ===== blank-fill test mode ===== */
  .blank-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:16px; }
  .blank-card{
    width:100%; max-width:540px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 26px;
  }
  .blank-title{ font-weight:700; font-size:15.5px; margin-bottom:6px; letter-spacing:-0.01em; }
  .blank-mnemonic{
    display:inline-block; font-size:11.5px;
    color:var(--text); background:var(--surface-2); padding:3px 9px; border-radius:6px; margin-bottom:14px;
  }
  .blank-passage{
    font-size:13px; line-height:1.85; color:var(--text-soft); white-space:pre-wrap;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px;
  }
  .blank-mark{ display:inline-block; min-width:46px; border-bottom:2px solid var(--accent); color:transparent; }
  .blank-inputs{ display:flex; flex-direction:column; gap:9px; }
  .blank-row{ display:flex; align-items:center; gap:10px; }
  .blank-row .bnum{ font-size:11px; color:var(--text-soft); width:18px; flex-shrink:0; }
  .blank-row input{ flex:1; }
  .blank-row.correct input{ border-color:var(--success); background:rgba(111,169,124,0.08); }
  .blank-row.wrong input{ border-color:var(--danger); background:rgba(196,104,90,0.08); }
  .blank-answer{ font-size:11.5px; color:var(--danger); margin-left:6px; white-space:nowrap; }
  .blank-controls{ display:flex; gap:8px; margin-top:18px; }
  .blank-score{ font-size:12px; color:var(--text-soft); margin-bottom:14px; }

  /* ===== AI button + drawer ===== */
  .seal-btn{
    position:fixed; right:26px; bottom:26px;
    width:56px; height:56px; border-radius:50%;
    background:var(--surface);
    color:var(--accent);
    border:1px solid var(--line);
    font-size:11px; font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,0.45);
    transition:transform .12s ease, border-color .12s ease;
    z-index:50;
  }
  .seal-btn:hover{ transform:scale(1.05); border-color:var(--accent); }
  .seal-btn:active{ transform:scale(0.95); }

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:flex-end;
    z-index:100;
  }
  .drawer-backdrop.open{ display:flex; }
  .drawer{
    width:410px; max-width:92vw; height:100%;
    background:var(--bg);
    border-left:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .drawer-head{
    padding:18px 20px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .drawer-head h3{ margin:0; font-weight:700; font-size:14.5px; }
  .drawer-tabs{ display:flex; border-bottom:1px solid var(--line); padding:0 8px; }
  .drawer-tab{
    flex:1; text-align:center; padding:12px 0; font-size:12px; font-weight:500; cursor:pointer;
    color:var(--text-soft); border-bottom:2px solid transparent;
  }
  .drawer-tab.active{ color:var(--text); border-bottom-color:var(--accent); }
  .drawer-body{ flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .close-x{ cursor:pointer; font-size:18px; color:var(--text-soft); line-height:1; background:none; border:none; }
  .ai-result{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:13px; line-height:1.75; white-space:pre-wrap;
    color:var(--text);
  }
  .hint{ font-size:11.5px; color:var(--text-soft); line-height:1.6; }
  .loading{ font-size:12px; color:var(--accent); }
  select{
    font-size:12.5px; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text);
  }
  @media (max-width: 720px){
    .spine{ width:60px; padding:16px 0; }
    .spine-title, .spine-foot, .volume .cnt{ display:none; }
    .volume{ justify-content:center; padding:12px 6px; }
    .volume span:not(.num){ display:none; }
    .content{ padding:16px; }
    .topbar{ padding:16px 16px 0; gap:14px; }
    .drawer{ width:100vw; }
  }
</style>
</head>
<body>

<nav class="spine">
  <div class="spine-title">나의 노무사<br>조문집<small>PRIVATE STUDY LEDGER</small></div>
  <div class="volumes" id="volumes"></div>

  <div class="spine-section">
    <div class="spine-section-label">바로가기</div>
    <div id="shortcutList"></div>
    <div id="addShortcutForm" style="display:none; flex-direction:column; gap:6px; margin-top:6px;">
      <input type="text" id="newShortcutName" placeholder="링크 이름 (예: 노동위원회)" class="shortcut-input">
      <input type="text" id="newShortcutUrl" placeholder="https://..." class="shortcut-input">
      <div style="display:flex; gap:6px;">
        <button class="btn small" id="confirmAddShortcut" style="flex:1;">추가</button>
        <button class="btn ghost small" id="cancelAddShortcut" style="flex:1;">취소</button>
      </div>
    </div>
    <button class="upload-entry" id="addShortcutBtn" style="opacity:0.7;">+ 링크 추가</button>
  </div>

  <div class="spine-section">
    <div class="spine-section-label">자료 변환</div>
    <button class="upload-entry" id="uploadEntryBtn"><span class="ext-dot" style="background:var(--brass);"></span>PDF·캡쳐 업로드</button>
  </div>

  <div class="spine-foot">2차 논술형 대비<br>판례·키워드·두문자</div>
</nav>

<main class="main">
  <div class="topbar" id="topbar">
    <div class="tab active" data-mode="list">목록</div>
    <div class="tab" data-mode="flashcard">플래시카드</div>
    <div class="tab" data-mode="quiz">퀴즈</div>
    <div class="tab" data-mode="blank">빈칸 테스트</div>
  </div>
  <div class="content" id="content"></div>
</main>

<button class="seal-btn" id="sealBtn" title="AI 열람">AI<br>열람</button>

<div class="drawer-backdrop" id="drawerBackdrop">
  <div class="drawer">
    <div class="drawer-head">
      <h3>AI 조교</h3>
      <button class="close-x" id="closeDrawer">×</button>
    </div>
    <div class="drawer-tabs">
      <div class="drawer-tab active" data-dtab="summarize">판례 요약</div>
      <div class="drawer-tab" data-dtab="ask">질의응답</div>
      <div class="drawer-tab" data-dtab="upload">파일 업로드</div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<script>
// Supabase 프로젝트 연결 정보 (anon public 키는 공개되어도 안전하도록 설계된 값입니다)
const SUPABASE_URL = 'https://iiavtxeskhagbuthxstk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpYXZ0eGVza2hhZ2J1dGh4c3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDI5NjUsImV4cCI6MjEwNDI3ODk2NX0.AB6Uwfftsdd-RTFKlyfIr3xZFLKL6IJStE0ocVAgCLs';

let supabaseClient = null;
let SETUP_ERROR = null;
try{
  if(SUPABASE_URL.includes('여기에') || SUPABASE_ANON_KEY.includes('여기에')){
    SETUP_ERROR = 'Supabase 연결 정보가 아직 입력되지 않았습니다. index.html 안의 SUPABASE_URL, SUPABASE_ANON_KEY 값을 Supabase 프로젝트의 실제 값으로 바꿔주세요. (README.md 2단계 참고)';

}catch(e){
  SETUP_ERROR = 'Supabase 연결에 실패했습니다: ' + e.message;
}

const SUBJECTS = [
  { key:'labor1', label:'노동법 1' },
  { key:'labor2', label:'노동법 2' },
  { key:'hr', label:'인사노무관리' },
  { key:'admin', label:'행정쟁송법' },
  { key:'elective', label:'선택과목' },
];

// 선택과목 이름을 사용자가 정한 이름으로 바꿔서 저장해둔 게 있으면 적용
try{
  const savedElectiveLabel = localStorage.getItem('elective-subject-label');
  if(savedElectiveLabel && savedElectiveLabel.trim()){
    SUBJECTS.find(s=>s.key==='elective').label = savedElectiveLabel.trim();
  }
}catch(e){}

let state = {
  subject: 'labor1',
  mode: 'list',
  notesCache: {},   // subjectKey -> array
  fcIndex: 0,
  fcFlipped: false,
  quizIndex: 0,
  quizRevealed: false,
  quizScore: { known:0, unknown:0 },
  blankIndex: 0,
  blankChecked: false,
  blankAnswers: [],
  editingElective: false,
  newNoteGrade: null,
};

// ---------- storage helpers (Supabase 데이터베이스에 저장 - 기기 상관없이 동일하게 보임) ----------
async function loadNotes(subjectKey){
  if(state.notesCache[subjectKey]) return state.notesCache[subjectKey];
  try{
    const { data, error } = await supabaseClient
      .from('notes')
      .select('*')
      .eq('subject', subjectKey)
      .order('created_at', { ascending:false });
    if(error) throw error;
    const arr = (data||[]).map(row => ({
      id: String(row.id),
      title: row.title || '',
      keywords: row.keywords || '',
      mnemonic: row.mnemonic || '',
      content: row.content || '',
      grade: row.grade || '',
      createdAt: row.created_at || new Date().toISOString(),
    }));
    state.notesCache[subjectKey] = arr;
    return arr;
  }catch(e){
    console.error('불러오기 실패', e);
    state.notesCache[subjectKey] = [];
    return [];
  }
}

async function saveNotes(subjectKey, arr){
  state.notesCache[subjectKey] = arr; // 화면은 먼저 즉시 갱신
  try{
    // 개인용 소규모 데이터라, 해당 과목 것을 전부 지우고 새로 넣는 단순한 방식 사용
    const { error: delErr } = await supabaseClient.from('notes').delete().eq('subject', subjectKey);
    if(delErr) throw delErr;
    if(arr.length > 0){
      const rows = arr.map(n => ({
        subject: subjectKey,
        title: n.title || '',
        keywords: n.keywords || '',
        mnemonic: n.mnemonic || '',
        content: n.content || '',
        grade: n.grade || '',
        created_at: n.createdAt || new Date().toISOString(),
      }));
      const { data, error: insErr } = await supabaseClient.from('notes').insert(rows).select();
      if(insErr) throw insErr;
      state.notesCache[subjectKey] = (data||[]).map(row => ({
        id: String(row.id),
        title: row.title || '',
        keywords: row.keywords || '',
        mnemonic: row.mnemonic || '',
        grade: row.grade || '',
        content: row.content || '',
        createdAt: row.created_at || new Date().toISOString(),
      }));
    }
  }catch(e){
    console.error('저장 실패', e);
    alert('저장에 실패했습니다. 인터넷 연결을 확인하거나 다시 시도해 주세요.');
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ---------- sidebar ----------
async function renderVolumes(){
  const el = document.getElementById('volumes');
  el.innerHTML = '';
  // 5개 과목의 개수를 순서대로가 아니라 한꺼번에(병렬로) 불러와서 속도를 높임
  const notesBySubject = await Promise.all(SUBJECTS.map(s => loadNotes(s.key)));
  for(let i=0;i<SUBJECTS.length;i++){
    const s = SUBJECTS[i];
    const notes = notesBySubject[i];
    const div = document.createElement('div');
    div.className = 'volume' + (s.key===state.subject ? ' active':'');
    div.tabIndex = 0;

    if(s.key === 'elective' && state.editingElective){
      div.classList.add('volume-editing');
      div.innerHTML = `
        <span class="num">제${i+1}권</span>
        <input type="text" class="volume-input" id="electiveInput" value="${escapeHtml(s.label==='선택과목'?'':s.label)}" placeholder="과목명 입력">
        <span class="volume-edit" data-save-elective="1" title="저장">✓</span>
        <span class="volume-edit" data-cancel-elective="1" title="취소">✕</span>
      `;
      el.appendChild(div);
      continue;
    }

    const editBtn = s.key === 'elective'
      ? `<span class="volume-edit" title="과목 이름 바꾸기" data-edit-elective="1">✏️</span>`
      : '';
    div.innerHTML = `<span class="num">제${i+1}권</span><span>${s.label}</span>${editBtn}<span class="cnt">${notes.length}</span>`;
    div.onclick = (e) => {
      if(e.target.closest('[data-edit-elective]')) return; // 연필 클릭은 과목 이동과 분리
      state.subject = s.key; state.fcIndex=0; state.quizIndex=0; state.fcFlipped=false; state.quizRevealed=false; state.blankIndex=0; state.blankChecked=false; state.blankAnswers=[]; render();
    };
    el.appendChild(div);
  }

  const editEl = el.querySelector('[data-edit-elective]');
  if(editEl){
    editEl.onclick = (e) => {
      e.stopPropagation();
      state.editingElective = true;
      renderVolumes().then(() => {
        const input = document.getElementById('electiveInput');
        if(input){ input.focus(); input.select(); }
      });
    };
  }
  const saveEl = el.querySelector('[data-save-elective]');
  if(saveEl){
    const commit = () => {
      const input = document.getElementById('electiveInput');
      const trimmed = (input ? input.value : '').trim();
      if(trimmed){
        SUBJECTS.find(s=>s.key==='elective').label = trimmed;
        try{ localStorage.setItem('elective-subject-label', trimmed); }catch(err){}
      }
      state.editingElective = false;
      render();
    };
    saveEl.onclick = (e) => { e.stopPropagation(); commit(); };
    const input = el.querySelector('#electiveInput');
    if(input){
      input.onkeydown = (e) => { if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ state.editingElective=false; render(); } };
      input.onclick = (e) => e.stopPropagation();
    }
  }
  const cancelEl = el.querySelector('[data-cancel-elective]');
  if(cancelEl){
    cancelEl.onclick = (e) => { e.stopPropagation(); state.editingElective = false; render(); };
  }
}

// ---------- topbar ----------
document.getElementById('topbar').addEventListener('click', (e)=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  state.mode = t.dataset.mode;
  state.fcIndex=0; state.fcFlipped=false; state.quizIndex=0; state.quizRevealed=false;
  state.blankIndex=0; state.blankChecked=false; state.blankAnswers=[];
  renderContent();
});

// ---------- main render ----------
async function render(){
  const banner = document.getElementById('setupErrorBanner');
  if(SETUP_ERROR){
    if(!banner){
      const div = document.createElement('div');
      div.id = 'setupErrorBanner';
      div.className = 'setup-error-banner';
      div.innerHTML = `⚠️ ${escapeHtml(SETUP_ERROR)}`;
      document.body.insertBefore(div, document.body.firstChild);
    }
  } else if(banner){
    banner.remove();
  }
  await renderVolumes();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===state.mode));
  await renderContent();
}

async function renderContent(){
  const content = document.getElementById('content');
  const subjectLabel = SUBJECTS.find(s=>s.key===state.subject).label;
  const notes = await loadNotes(state.subject);

  if(state.mode === 'list') renderList(content, subjectLabel, notes);
  else if(state.mode === 'flashcard') renderFlashcard(content, subjectLabel, notes);
  else if(state.mode === 'quiz') renderQuiz(content, subjectLabel, notes);
  else renderBlank(content, subjectLabel, notes);
}

// ---------- LIST MODE ----------
function renderList(content, subjectLabel, notes){
  content.innerHTML = `
    <div class="subject-head"><h1>${subjectLabel}</h1><span class="sub">${notes.length}건 수록</span></div>
    <div class="add-card">
      <h3>새 항목 추가</h3>
      <div class="field-row"><div style="flex:1"><label>제목 / 판례명</label><input type="text" id="inTitle" placeholder="예: 근로기준법상 근로자성 판단기준"></div></div>
      <div class="field-row"><div style="flex:1"><label>핵심 키워드 (쉼표로 구분 · 빈칸 테스트에 사용됩니다)</label><input type="text" id="inKeywords" placeholder="예: 사용종속관계, 겸업금지, 신의성실"></div></div>
      <div class="field-row"><div style="flex:1"><label>암기용 두문자</label><input type="text" id="inMnemonic" placeholder="예: 사겸신 (키워드 앞글자를 조합해 보세요)"></div></div>
      <div class="field-row"><div style="flex:1"><label>요지 / 내용</label><textarea id="inContent" placeholder="판례 요지, 논점, 암기 포인트를 정리하세요"></textarea></div></div>
      <div class="field-row"><div style="flex:1">
        <label>중요도</label>
        <div class="grade-picker" id="gradePicker">
          ${['A','B','C','D'].map(g => `<div class="grade-pill${state.newNoteGrade===g?' active':''}" data-grade="${g}">${g}</div>`).join('')}
        </div>
      </div></div>
      <button class="btn" id="addNoteBtn">저장</button>
    </div>
    <div id="noteList"></div>
  `;

  content.querySelectorAll('#gradePicker .grade-pill').forEach(pill => {
    pill.onclick = () => {
      const g = pill.dataset.grade;
      state.newNoteGrade = (state.newNoteGrade === g) ? null : g; // 다시 누르면 선택 해제
      content.querySelectorAll('#gradePicker .grade-pill').forEach(p => p.classList.toggle('active', p.dataset.grade === state.newNoteGrade));
      pill.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    };
  });

  document.getElementById('addNoteBtn').onclick = async ()=>{
    const title = document.getElementById('inTitle').value.trim();
    const keywords = document.getElementById('inKeywords').value.trim();
    const mnemonic = document.getElementById('inMnemonic').value.trim();
    const body = document.getElementById('inContent').value.trim();
    const grade = state.newNoteGrade || '';
    if(!title){ alert('제목을 입력해 주세요.'); return; }
    const arr = await loadNotes(state.subject);
    arr.unshift({ id:uid(), title, keywords, mnemonic, content:body, grade, createdAt: new Date().toISOString() });
    await saveNotes(state.subject, arr);
    state.newNoteGrade = null;
    render();
  };

  const listEl = document.getElementById('noteList');
  if(notes.length===0){
    listEl.innerHTML = '<div class="empty">아직 등록된 항목이 없습니다.<br>위 양식으로 첫 판례·키워드를 기록해 보세요.</div>';
    return;
  }
  listEl.innerHTML = notes.map(n => `
    <div class="note-card" data-id="${n.id}">
      <div class="note-top">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
          ${n.grade ? `<span class="grade-badge" data-grade="${n.grade}">${n.grade}</span>` : ''}
          <div class="note-title">${escapeHtml(n.title)}</div>
        </div>
        <div class="note-date">${formatDate(n.createdAt)}</div>
      </div>
      <div class="note-keywords">${(n.keywords||'').split(',').filter(k=>k.trim()).map(k=>`<span class="kw">${escapeHtml(k.trim())}</span>`).join('')}${n.mnemonic ? `<span class="kw" style="background:rgba(111,163,179,0.16);color:var(--teal);">두문자 · ${escapeHtml(n.mnemonic)}</span>` : ''}</div>
      <div class="note-body">${escapeHtml(n.content||'')}</div>
      <div class="note-actions">
        <button class="btn ghost small" data-act="edit">수정</button>
        <button class="btn danger small" data-act="del">삭제</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.note-card').forEach(card=>{
    const id = card.dataset.id;
    card.querySelector('[data-act="del"]').onclick = async ()=>{
      if(!confirm('이 항목을 삭제할까요?')) return;
      const arr = (await loadNotes(state.subject)).filter(n=>n.id!==id);
      await saveNotes(state.subject, arr);
      render();
    };
    card.querySelector('[data-act="edit"]').onclick = async ()=>{
      const arr = await loadNotes(state.subject);
      const n = arr.find(x=>x.id===id);
      const newTitle = prompt('제목', n.title);
      if(newTitle===null) return;
      const newKw = prompt('키워드(쉼표 구분)', n.keywords||'');
      const newMn = prompt('암기용 두문자', n.mnemonic||'');
      const newGrade = prompt('중요도 (A, B, C, D 중 입력 · 비워두면 해제)', n.grade||'');
      const newBody = prompt('내용', n.content||'');
      n.title = newTitle.trim() || n.title;
      n.keywords = newKw===null? n.keywords : newKw.trim();
      n.mnemonic = newMn===null? n.mnemonic : newMn.trim();
      if(newGrade!==null){
        const g = newGrade.trim().toUpperCase();
        n.grade = ['A','B','C','D'].includes(g) ? g : '';
      }
      n.content = newBody===null? n.content : newBody.trim();
      await saveNotes(state.subject, arr);
      render();
    };
  });
}

// ---------- FLASHCARD MODE ----------
function renderFlashcard(content, subjectLabel, notes){
  if(notes.length===0){
    content.innerHTML = `<div class="subject-head"><h1>${subjectLabel} · 플래시카드</h1></div><div class="empty">먼저 '목록' 탭에서 항목을 등록해 주세요.</div>`;
    return;
  }
  if(state.fcIndex >= notes.length) state.fcIndex = 0;
  const n = notes[state.fcIndex];
  content.innerHTML = `
    <div class="subject-head"><h1>${subjectLabel} · 플래시카드</h1></div>
    <div class="fc-wrap">
      <div class="fc-progress">${state.fcIndex+1} / ${notes.length}</div>
      <div class="flashcard" id="fcCard">
        <span class="face-label">${state.fcFlipped ? '내용' : '제목 / 키워드'}</span>
        ${state.fcFlipped
          ? `<div class="fc-body">${escapeHtml(n.content || '(등록된 내용 없음)')}</div>`
          : `<div class="fc-title">${n.grade ? `<span class="grade-badge" data-grade="${n.grade}" style="margin-right:8px; vertical-align:middle;">${n.grade}</span>` : ''}${escapeHtml(n.title)}</div><div class="fc-body">${(n.keywords||'').split(',').filter(k=>k.trim()).map(k=>k.trim()).join(' · ')}</div>${n.mnemonic ? `<div class="blank-mnemonic" style="margin-top:10px;">두문자 · ${escapeHtml(n.mnemonic)}</div>` : ''}`
        }
      </div>
      <div class="fc-controls">
        <button class="btn ghost small" id="fcPrev">← 이전</button>
        <button class="btn small" id="fcFlip">뒤집기</button>
        <button class="btn ghost small" id="fcShuffle">섞기</button>
        <button class="btn ghost small" id="fcNext">다음 →</button>
      </div>
    </div>
  `;
  document.getElementById('fcCard').onclick = ()=>{ state.fcFlipped=!state.fcFlipped; renderContent(); };
  document.getElementById('fcFlip').onclick = (e)=>{ e.stopPropagation(); state.fcFlipped=!state.fcFlipped; renderContent(); };
  document.getElementById('fcPrev').onclick = (e)=>{ e.stopPropagation(); state.fcIndex=(state.fcIndex-1+notes.length)%notes.length; state.fcFlipped=false; renderContent(); };
  document.getElementById('fcNext').onclick = (e)=>{ e.stopPropagation(); state.fcIndex=(state.fcIndex+1)%notes.length; state.fcFlipped=false; renderContent(); };
  document.getElementById('fcShuffle').onclick = (e)=>{ e.stopPropagation(); state.fcIndex = Math.floor(Math.random()*notes.length); state.fcFlipped=false; renderContent(); };
}

// ---------- QUIZ MODE ----------
function renderQuiz(content, subjectLabel, notes){
  if(notes.length===0){
    content.innerHTML = `<div class="subject-head"><h1>${subjectLabel} · 퀴즈</h1></div><div class="empty">먼저 '목록' 탭에서 항목을 등록해 주세요.</div>`;
    return;
  }
  if(state.quizIndex >= notes.length) state.quizIndex = 0;
  const n = notes[state.quizIndex];
  content.innerHTML = `
    <div class="subject-head"><h1>${subjectLabel} · 퀴즈</h1></div>
    <div class="quiz-wrap">
      <div class="quiz-score">맞음 ${state.quizScore.known} · 다시 ${state.quizScore.unknown} · ${state.quizIndex+1}/${notes.length}</div>
      <div class="quiz-card">
        <div class="quiz-q">${n.grade ? `<span class="grade-badge" data-grade="${n.grade}" style="margin-right:8px; vertical-align:middle;">${n.grade}</span>` : ''}${escapeHtml(n.title)}</div>
        <div class="quiz-kw">${(n.keywords||'').split(',').filter(k=>k.trim()).map(k=>`<span class="kw">${escapeHtml(k.trim())}</span>`).join('')}${n.mnemonic ? `<span class="kw" style="background:rgba(111,163,179,0.16);color:var(--teal);">두문자 · ${escapeHtml(n.mnemonic)}</span>` : ''}</div>
        ${state.quizRevealed ? `<div class="quiz-answer">${escapeHtml(n.content || '(등록된 내용 없음)')}</div>` : ''}
        <div style="margin-top:16px; display:flex; gap:8px;">
          ${state.quizRevealed
            ? `<button class="btn small" id="qKnown">알고 있음</button><button class="btn ghost small" id="qUnknown">다시 볼게요</button>`
            : `<button class="btn small" id="qReveal">정답 확인</button>`
          }
        </div>
      </div>
    </div>
  `;
  const next = ()=>{ state.quizIndex=(state.quizIndex+1)%notes.length; state.quizRevealed=false; renderContent(); };
  const revealBtn = document.getElementById('qReveal');
  if(revealBtn) revealBtn.onclick = ()=>{ state.quizRevealed=true; renderContent(); };
  const kBtn = document.getElementById('qKnown');
  if(kBtn) kBtn.onclick = ()=>{ state.quizScore.known++; next(); };
  const uBtn = document.getElementById('qUnknown');
  if(uBtn) uBtn.onclick = ()=>{ state.quizScore.unknown++; next(); };
}

// ---------- BLANK-FILL TEST MODE ----------
function renderBlank(content, subjectLabel, notes){
  const withKw = notes.filter(n => (n.keywords||'').split(',').some(k=>k.trim()));
  if(withKw.length===0){
    content.innerHTML = `<div class="subject-head"><h1>${subjectLabel} · 빈칸 테스트</h1></div><div class="empty">키워드가 등록된 항목이 없습니다.<br>'목록' 탭에서 항목에 핵심 키워드를 추가해 주세요.</div>`;
    return;
  }
  if(state.blankIndex >= withKw.length) state.blankIndex = 0;
  const n = withKw[state.blankIndex];
  const keywords = (n.keywords||'').split(',').map(k=>k.trim()).filter(Boolean);
  if(state.blankAnswers.length !== keywords.length) state.blankAnswers = keywords.map(()=> '');

  // build a passage with keyword occurrences masked, if the keyword text appears in content
  let passage = escapeHtml(n.content || '');
  keywords.forEach((kw, i)=>{
    if(!kw) return;
    const re = new RegExp(escapeHtml(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    passage = passage.replace(re, `<span class="blank-mark">${escapeHtml(kw)}</span>`);
  });

  content.innerHTML = `
    <div class="subject-head"><h1>${subjectLabel} · 빈칸 테스트</h1></div>
    <div class="blank-score">${state.blankIndex+1} / ${withKw.length}</div>
    <div class="blank-wrap">
      <div class="blank-card">
        <div class="blank-title">${escapeHtml(n.title)}</div>
        ${n.mnemonic ? `<div class="blank-mnemonic">두문자 힌트 · ${escapeHtml(n.mnemonic)}</div>` : ''}
        ${n.content ? `<div class="blank-passage">${passage}</div>` : ''}
        <div class="blank-inputs" id="blankInputs">
          ${keywords.map((kw,i)=>`
            <div class="blank-row" data-idx="${i}">
              <span class="bnum">${i+1}</span>
              <input type="text" data-idx="${i}" placeholder="키워드 ${i+1} 입력" value="${escapeHtml(state.blankAnswers[i]||'')}" ${state.blankChecked?'disabled':''}>
              <span class="blank-answer" data-idx="${i}"></span>
            </div>
          `).join('')}
        </div>
        <div class="blank-controls">
          ${state.blankChecked
            ? `<button class="btn small" id="blankNext">다음 항목 →</button><button class="btn ghost small" id="blankRetry">다시 풀기</button>`
            : `<button class="btn small" id="blankCheck">채점하기</button>`
          }
        </div>
      </div>
    </div>
  `;

  content.querySelectorAll('#blankInputs input').forEach(inp=>{
    inp.oninput = ()=>{ state.blankAnswers[+inp.dataset.idx] = inp.value; };
    inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); const chk=document.getElementById('blankCheck'); if(chk) chk.click(); } };
  });

  const normalize = s => (s||'').trim().toLowerCase().replace(/\s+/g,'');
  const checkBtn = document.getElementById('blankCheck');
  if(checkBtn) checkBtn.onclick = ()=>{
    state.blankChecked = true;
    content.querySelectorAll('.blank-row').forEach((row,i)=>{
      const ok = normalize(state.blankAnswers[i]) === normalize(keywords[i]) && normalize(state.blankAnswers[i]) !== '';
      row.classList.add(ok ? 'correct' : 'wrong');
      if(!ok) row.querySelector('.blank-answer').textContent = '정답: ' + keywords[i];
      row.querySelector('input').disabled = true;
    });
    document.querySelector('.blank-controls').innerHTML = `<button class="btn small" id="blankNext">다음 항목 →</button><button class="btn ghost small" id="blankRetry">다시 풀기</button>`;
    document.getElementById('blankNext').onclick = ()=>{ state.blankIndex=(state.blankIndex+1)%withKw.length; state.blankChecked=false; state.blankAnswers=[]; renderContent(); };
    document.getElementById('blankRetry').onclick = ()=>{ state.blankChecked=false; state.blankAnswers = keywords.map(()=> ''); renderContent(); };
  };
  const nextBtn = document.getElementById('blankNext');
  if(nextBtn) nextBtn.onclick = ()=>{ state.blankIndex=(state.blankIndex+1)%withKw.length; state.blankChecked=false; state.blankAnswers=[]; renderContent(); };
  const retryBtn = document.getElementById('blankRetry');
  if(retryBtn) retryBtn.onclick = ()=>{ state.blankChecked=false; state.blankAnswers = keywords.map(()=> ''); renderContent(); };
}

// ---------- utils ----------
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso){
  try{ const d = new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
  catch(e){ return ''; }
}

async function callClaude(prompt){
  const response = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  if(!response.ok){
    throw new Error('AI 요청 실패 (' + response.status + ')');
  }
  const data = await response.json();
  return (data.text || '').trim();
}

// ---------- 바로가기 링크 (기본 Claude/Gemini + 사용자가 추가한 링크) ----------
const DEFAULT_SHORTCUTS = [
  { name:'Claude 열기', url:'https://claude.ai', dot:'#D97757' },
  { name:'Gemini 열기', url:'https://gemini.google.com', dot:'#4C8DF6' },
];
function loadCustomShortcuts(){
  try{
    const raw = localStorage.getItem('custom-shortcuts');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCustomShortcuts(list){
  try{ localStorage.setItem('custom-shortcuts', JSON.stringify(list)); }catch(e){}
}
function renderShortcuts(){
  const el = document.getElementById('shortcutList');
  const custom = loadCustomShortcuts();
  el.innerHTML = '';
  DEFAULT_SHORTCUTS.forEach(s => {
    const a = document.createElement('a');
    a.className = 'ext-link';
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<span class="ext-dot" style="background:${s.dot};"></span>${escapeHtml(s.name)}`;
    el.appendChild(a);
  });
  custom.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'ext-link-row';
    row.innerHTML = `
      <a class="ext-link" href="${escapeHtml(s.url)}" target="_blank" rel="noopener"><span class="ext-dot" style="background:#8FA6B3;"></span>${escapeHtml(s.name)}</a>
      <span class="ext-remove" data-idx="${i}" title="삭제">✕</span>
    `;
    el.appendChild(row);
  });
  el.querySelectorAll('.ext-remove').forEach(btn => {
    btn.onclick = () => {
      const list = loadCustomShortcuts();
      list.splice(+btn.dataset.idx, 1);
      saveCustomShortcuts(list);
      renderShortcuts();
    };
  });
}
document.getElementById('addShortcutBtn').onclick = () => {
  const form = document.getElementById('addShortcutForm');
  form.style.display = form.style.display === 'none' ? 'flex' : 'none';

};

};
document.getElementById('confirmAddShortcut').onclick = () => {
  const name = document.getElementById('newShortcutName').value.trim();
  let url = document.getElementById('newShortcutUrl').value.trim();
  if(!name || !url){ alert('이름과 주소를 모두 입력해 주세요.'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const list = loadCustomShortcuts();
  list.push({ name, url });
  saveCustomShortcuts(list);
  document.getElementById('newShortcutName').value = '';
  document.getElementById('newShortcutUrl').value = '';
  document.getElementById('addShortcutForm').style.display = 'none';
  renderShortcuts();
};
